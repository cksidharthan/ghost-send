version: '3'

tasks:
  run:
    desc: Run the application
    cmds:
      - go run main.go

  deps:
    desc: Install Go dependencies
    cmds:
      - go mod download
      - go mod verify
      - go mod tidy

  frontend-deps:
    dir: frontend
    desc: Install frontend dependencies
    cmds:
      - npm install

  build-frontend:
    dir: frontend
    desc: Build the Nuxt frontend (generates static files into frontend/.output/public)
    cmds:
      - npm run generate

  build:
    desc: Build the full binary (frontend must be built first)
    deps: [build-frontend]
    cmds:
      - CGO_ENABLED=0 go build -ldflags "-w -s" -o ghost-send main.go

  dev-setup:
    desc: Setup the project for development
    cmds:
      - go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - brew install sqlc
      - task: deps
      - task: frontend-deps

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  lint:
    desc: Lint Go code
    cmds:
      - golangci-lint run ./...
      - go vet ./...

  test:
    desc: Run all Go tests
    cmds:
      - go test -v -cover ./...

  sqlc:
    desc: Generate SQLC code
    cmds:
      - sqlc generate

  up:
    dir: .
    desc: Start the application (builds frontend first)
    deps: [build-frontend]
    cmds:
      - go run main.go

  deploy:
    desc: Deploy with docker compose
    cmds:
      - docker compose up -d --build

  deploy-postgres:
    desc: Deploy only postgres
    cmds:
      - docker compose up -d postgres

  down:
    desc: Stop docker compose services
    cmds:
      - docker compose down
