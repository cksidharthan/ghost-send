services:
  postgres:
    image: postgres:17.0-alpine3.20
    networks:
      - ghost-network
    restart: unless-stopped
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "ghostsend", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  backend:
    image: cksidharthan/ghostsend-backend:latest
    platform: linux/amd64
    ports:
      - "8080:8080"
    networks:
      - ghost-network
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

networks:
  ghost-network:
    driver: bridge
